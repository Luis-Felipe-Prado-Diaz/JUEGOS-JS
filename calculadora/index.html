<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <script type="module" src="./src/calculos.js"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="calculadora">
    <div class="cal-imput">
      <input type="number" id="numero" placeholder="7 + 5">
    </div>
    <div class="buttons-numbers">
      <div class="button-number">
        <button>1</button>
      </div>
      <div class="button-number">
        <button>2</button>
      </div>
      <div class="button-number">
        <button>3</button>
      </div>
      <div class="button-number">
        <button>4</button>
      </div>
      <div class="button-number">
        <button>5</button>
      </div>
      <div class="button-number">
        <button>6</button>
      </div>
      <div class="button-number">
        <button>7</button>
      </div>
      <div class="button-number">
        <button>8</button>
      </div>
      <div class="button-number">
        <button>9</button>
      </div>
      <div class="button-number">
        <button>0</button>
      </div>
      <div class="button-number">
        <button>00</button>
      </div>
      <div class="button-number">
        <button>.</button>
      </div>
    </div>
    <div class="buttons-operations">
      <div class="button-operation suma">
        <button>+ </button>
      </div>
      <div class="button-operation resta">
        <button>-</button>
      </div>
      <div class="button-operation multiplicacion">
        <button>x</button>
      </div>
      <div class="button-operation division">
        <button>÷</button>
      </div>
      <div class="button-operation limpiar">
        <button>C</button>
      </div>
      <div class="button-operation igual">
        <button>=</button>
      </div>
    </div>
  </div>
  <div class="sonido">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <title>music-circle</title>
      <path
        d="M16,9V7H12V12.5C11.58,12.19 11.07,12 10.5,12A2.5,2.5 0 0,0 8,14.5A2.5,2.5 0 0,0 10.5,17A2.5,2.5 0 0,0 13,14.5V9H16M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z" />
    </svg>
  </div>
  <audio class="audio" src="./audio/bart-ay-caramba.mp3"></audio>
  <audio class="audio2" src="./audio/homero-ouch.mp3"></audio>
</body>

</html>
