<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <script type="module" src="./src/calculos.js"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="imagen-de-fondo homero">
    <img src="./imagenes/pngwing.com.png" alt="">
  </div>
  <div class="imagen-de-fondo rosquilla">
    <img src="./imagenes/rosquilla.png" alt="">
  </div>

  <div class="calculadora">
    <div class="cal-imput">
      <input type="text" id="numero" name="calculadora" placeholder="0" disabled>
    </div>
    <div class="buttons-numbers">
      <div class="button-number">
        <button class="1">1</button>
      </div>
      <div class="button-number">
        <button class="2">2</button>
      </div>
      <div class="button-number">
        <button class="3">3</button>
      </div>
      <div class="button-number">
        <button class="4">4</button>
      </div>
      <div class="button-number">
        <button class="5">5</button>
      </div>
      <div class="button-number">
        <button class="6">6</button>
      </div>
      <div class="button-number">
        <button class="7">7</button>
      </div>
      <div class="button-number">
        <button class="8">8</button>
      </div>
      <div class="button-number">
        <button class="9">9</button>
      </div>
      <div class="button-number">
        <button class="0">0</button>
      </div>
      <div class="button-number">
        <button class="00">00</button>
      </div>
      <div class="button-number">
        <button class=".">.</button>
      </div>
    </div>
    <div class="buttons-operations">
      <div class="button-operation">
        <button class="+">+ </button>
      </div>
      <div class="button-operation">
        <button class="-">-</button>
      </div>
      <div class="button-operation">
        <button class="*">*</button>
      </div>
      <div class="button-operation">
        <button class="/">÷</button>
      </div>
      <div class="button-operation">
        <button class="C">C</button>
      </div>
      <div class="button-operation">
        <button class="x">[x]</button>
      </div>
      <div class="button-operation">
        <button class="=">=</button>
      </div>
    </div>
  </div>
  <div class="sonido">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <title>music-circle</title>
      <path
        d="M16,9V7H12V12.5C11.58,12.19 11.07,12 10.5,12A2.5,2.5 0 0,0 8,14.5A2.5,2.5 0 0,0 10.5,17A2.5,2.5 0 0,0 13,14.5V9H16M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2Z" />
    </svg>
  </div>
  <audio class="audio" src="./audio/bart-ay-caramba.mp3"></audio>
  <audio class="audio2" src="./audio/homero-ouch.mp3"></audio>
</body>

</html>
