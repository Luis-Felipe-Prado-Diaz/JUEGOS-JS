<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <script type="module" src="./src/calculos.js"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="calculadora">
    <div class="cal-imput">
      <input type="number" placeholder="7 + 5">
    </div>
    <div class="buttons-numbers">
      <div class="button-number">
        <button>1</button>
      </div>
      <div class="button-number">
        <button>2</button>
      </div>
      <div class="button-number">
        <button>3</button>
      </div>
      <div class="button-number">
        <button>4</button>
      </div>  
      <div class="button-number">
        <button>5</button>
      </div>
      <div class="button-number">
        <button>6</button>
      </div>
      <div class="button-number">
        <button>7</button>
      </div>
      <div class="button-number">
        <button>8</button>
      </div>
      <div class="button-number">
        <button>9</button>
      </div>
      <div class="button-number">
        <button>0</button>
      </div>
      <div class="button-number">
        <button>00</button>
      </div>
      <div class="button-number">
        <button>.</button>
      </div>
    </div>
    <div class="buttons-operations">
      <div class="button-operation suma">
        <button>+ </button>
      </div>
      <div class="button-operation resta">
        <button>-</button>
      </div>
      <div class="button-operation multiplicacion">
        <button>x</button>
      </div>
      <div class="button-operation division">
        <button>÷</button>
      </div>
      <div class="button-operation limpiar">
        <button>C</button>
      </div>
      <div class="button-operation igual">
        <button>=</button>
      </div>
    </div>
  </div>
</body>
</html>
