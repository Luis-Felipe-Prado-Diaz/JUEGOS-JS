<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slaider</title>
  <script type="module" src="./src/index.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main>
    <div class="slaider">
      <div class="scene">
        <div class="carousel">
          <div class="carousel__cell">
            <div class="imagen">
              <img src="./image/Margarita.webp" alt="margarita">
            </div>
          </div>
          <div class="carousel__cell">
            <div class="imagen">
              <img src="./image/Mojito.webp" alt="Mojito">
            </div>
          </div>
          <div class="carousel__cell">
            <div class="imagen">
              <img src="./image/vodka.webp" alt="VodkaTonic">
            </div>
          </div>
          <div class="carousel__cell">
            <div class="imagen">
              <img src="./image/negroni.webp" alt="Negroni">
            </div>
          </div>
          <div class="carousel__cell">
            <div class="imagen">
              <img src="./image/old.webp" alt="Old fashioned">
            </div>
          </div>
          <div class="carousel__cell">6</div>
          <div class="carousel__cell">7</div>
          <div class="carousel__cell">8</div>
          <div class="carousel__cell">9</div>
          <div class="carousel__cell">10</div>
          <div class="carousel__cell">11</div>
          <div class="carousel__cell">12</div>
          <div class="carousel__cell">13</div>
          <div class="carousel__cell">14</div>
          <div class="carousel__cell">15</div>
        </div>
      </div>

      <div class="carousel-options">
        <p>
          <label>
            Cells
            <input class="cells-range" type="range" min="3" max="15" value="9" />
          </label>
        </p>
        <p>
          <button class="previous-button">Previous</button>
          <button class="next-button">Next</button>
        </p>
      </div>
    </div>
  </main>
</body>

</html>
